
<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="css/customer.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>SUBSCRIPTION HUB</h2>

        <p class="menu-title">CUSTOMER MENU</p>

        <a href="customer-dashboard.html">Dashboard</a>
        <a href="my-profile.html" class="active">My Profile</a>
        <a href="plans.html">Products & Plans</a>
        <a href="my-subscriptions.html">My Subscriptions</a>
       <a href="quotations.html">Quotations</a>
        <a href="my-invoices.html">My Invoices</a>
        <a href="payment-history.html">Payment History</a>
        <a href="login.html" class="logout">Logout</a>
    </aside>


    <main class="main-content">

        <header>
            <div>
                <h1>My Profile</h1>
                <p>View and update your personal information.</p>
            </div>
        </header>


        <section class="content-box">

            <h2>Personal Information</h2>

            <form id="profileForm">

                <label>Customer ID</label>
                <input type="text" id="customerId" value="CUS001" readonly>

                <label>Full Name</label>
                <input type="text" id="profileName"
                       value="Sample Customer" required>

                <label>Email Address</label>
                <input type="email" id="profileEmail"
                       value="customer@example.com" required>

                <label>Phone Number</label>
                <input type="tel" id="profilePhone"
                       value="9876543210" required>

                <button type="submit">Update Profile</button>

            </form>

            <p id="profileMessage"></p>

        </section>


        <section class="content-box">

            <h2>Change Password</h2>

            <form id="passwordForm">

                <label>Current Password</label>
                <input type="password" id="currentPassword" required>

                <label>New Password</label>
                <input type="password" id="newPassword" required>

                <label>Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required>

                <button type="submit">Change Password</button>

            </form>

            <p id="passwordMessage"></p>

        </section>

    </main>

</div>

<script src="js/profile.js"></script>

</body>
</html>
